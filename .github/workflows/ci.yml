name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_data:
        description: 'Also download UCI data and train/evaluate the real baseline'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Check product retrieval
        run: python scripts/evaluate_retrieval.py
      - name: Generate synthetic smoke-test data
        run: python scripts/make_smoke_data.py
      - name: Train smoke-test model (not a release model)
        run: python -m bank_ml.train --data data/smoke.csv
      - name: Check prediction
        run: python -m bank_ml.predict
      - name: Build container
        run: docker build -t bank-ml:test .
      - name: Check running container
        shell: bash
        run: |
          docker run -d --name bank-ml -p 127.0.0.1:8000:8000 bank-ml:test
          trap 'docker logs bank-ml; docker rm -f bank-ml' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          MODEL_PATH=release/model.joblib python scripts/check_api.py

      - name: Build managed-inference wrapper
        run: docker build -f Dockerfile.sagemaker --build-arg APP_IMAGE=bank-ml:test -t bank-ml:sagemaker .
      - name: Check managed-inference container contract locally
        shell: bash
        run: |
          docker run -d --name bank-sagemaker -p 127.0.0.1:18080:8080 -v "$PWD/release:/opt/ml/model:ro" bank-ml:sagemaker serve
          trap 'docker logs bank-sagemaker; docker rm -f bank-sagemaker' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ping; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          python scripts/check_sagemaker.py

  real-data:
    if: github.event_name == 'workflow_dispatch' && inputs.real_data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - name: Download real UCI dataset
        run: python -m bank_ml.data
      - name: Train and evaluate real baseline
        run: python -m bank_ml.train
      - run: python -m bank_ml.predict
