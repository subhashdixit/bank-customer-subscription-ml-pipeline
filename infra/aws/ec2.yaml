AWSTemplateFormatVersion: '2010-09-09'
Description: Bank subscription educational single-VM deployment. Creates billable resources.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Must belong to VpcId, with a route to an internet gateway.
  AllowedCidr:
    Type: String
    Description: Your public IPv4 followed by /32 for the HTTP learning exercise.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])'
  ImageUri:
    Type: String
    Description: Full image URI in ECR in this account and region, preferably pinned with @sha256.
  RepositoryName:
    Type: String
    Default: bank-subscription
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restricted HTTP demo access; management uses SSM, no inbound SSH.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullOnlyAppImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnetId
          GroupSet: [!Ref AppSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Project, Value: bank-subscription-learning}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
          aws ecr get-login-password --region '${AWS::Region}' | docker login --username AWS --password-stdin '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
          docker pull '${ImageUri}'
          cat > /etc/systemd/system/bank-subscription.service <<'UNIT'
          [Unit]
          Description=Bank customer subscription demo
          Requires=docker.service
          After=docker.service network-online.target
          [Service]
          Restart=always
          RestartSec=5
          ExecStart=/usr/bin/docker run --rm --name bank-subscription --log-opt max-size=10m --log-opt max-file=3 -e PORT=8000 -e ALLOW_LLM_REQUESTS=false -p 80:8000 ${ImageUri}
          ExecStop=/usr/bin/docker stop -t 10 bank-subscription
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now bank-subscription
Outputs:
  InstanceId:
    Value: !Ref Instance
  DemoUrl:
    Value: !Sub http://${Instance.PublicIp}
  RoleArn:
    Value: !GetAtt InstanceRole.Arn
