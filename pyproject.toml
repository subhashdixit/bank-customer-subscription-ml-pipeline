[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-customer-subscription-ml-pipeline"
version = "0.1.0"
description = "A beginner-friendly, local-first bank marketing ML deployment project"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "scikit-learn>=1.5,<1.8", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
