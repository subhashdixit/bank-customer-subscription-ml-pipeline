[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-customer-subscription-ml-pipeline"
version = "0.1.0"
description = "A beginner-friendly, local-first bank marketing ML deployment project"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "scikit-learn==1.7.2", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "faiss-cpu>=1.8,<2", "httpx>=0.27,<1", "Flask>=3.1,<4", "a2wsgi>=1.10,<2"]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
bank_ml = ["knowledge/*.json", "templates/*.html", "static/*.css", "static/*.js"]
